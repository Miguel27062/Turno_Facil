{% extends 'turnos/base.html' %}
{% block titulo %}Pedir turno{% endblock %}
{% block contenido %}
<div style="max-width:640px;margin:auto">
  <h1 class="entra" style="font-size:clamp(2rem,5vw,3rem);margin-bottom:1.5rem">Pide tu turno</h1>
  <form method="post" class="glass entra" novalidate>
    {% csrf_token %}
    {% if servicios %}
    <div class="campo"><label>¿Qué necesita tu vehículo?</label>
      <div class="opciones">
        {% for s in servicios %}
        <label class="opcion"><input type="radio" name="servicio" value="{{ s.id }}" {% if forloop.first %}checked{% endif %} data-sel="{{ request.GET.servicio }}">
          <span><b>{{ s.icono }}</b>{{ s.nombre }}<small>≈ {{ s.promedio_real }} min</small></span></label>
        {% endfor %}
      </div></div>
    {% endif %}
    <div class="campo"><label for="cliente">Tu nombre</label>
      <input id="cliente" name="cliente" required autocomplete="name" maxlength="100"></div>
    <div class="campo"><label for="telefono">Celular (opcional, para avisarte)</label>
      <input id="telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" maxlength="20"></div>
    <div class="campo"><label for="placa">Placa del vehículo (opcional)</label>
      <input id="placa" name="placa" maxlength="10" autocapitalize="characters" autocomplete="off"></div>
    <div class="campo"><label for="necesidad">Cuéntanos qué pasa</label>
      <textarea id="necesidad" name="necesidad" rows="3" placeholder="Ej: ruido al frenar, revisión antes de viaje"></textarea></div>
    <div class="campo"><label class="check"><input type="checkbox" name="prioritario">Soy adulto mayor, tengo movilidad reducida o voy con un bebé</label></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Generar mi turno</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  const sel = document.querySelector('[data-sel]')?.dataset.sel;
  if (sel) document.querySelector(`input[name=servicio][value="${CSS.escape(sel)}"]`)?.click();
</script>
{% endblock %}
