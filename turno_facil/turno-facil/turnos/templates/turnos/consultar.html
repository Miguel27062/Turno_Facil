{% extends 'turnos/base.html' %}
{% block titulo %}Mi turno{% endblock %}
{% block contenido %}
<div style="max-width:520px;margin:auto">
  <h1 class="entra" style="font-size:clamp(2rem,5vw,3rem);margin-bottom:1.5rem">Consulta tu turno</h1>
  <form method="post" class="glass entra">
    {% csrf_token %}
    <div class="campo"><label for="numero">Código de turno</label>
      <input id="numero" name="numero" placeholder="A-012" autocapitalize="characters" required autofocus></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Ver mi posición</button>
  </form>
</div>
{% endblock %}
